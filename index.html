        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .click-target {
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4), 0 8px 10px -6px rgba(16, 185, 129, 0.2);
        }
        
        .click-target:active {
            transform: scale(0.92);
            box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.3);
        }

        .golden-target {
            animation: pulseGlow 0.6s infinite alternate;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.8) !important;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        .floating-text {
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.3);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            deleteDoc, 
            collection, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase初期設定
        const firebaseConfig = {
            apiKey: "AIzaSyD25UJDg-A1c-WgkQpWEKp2Q_ukjhqF7wo",
            authDomain: "tap1-df28f.firebaseapp.com",
            projectId: "tap1-df28f",
            storageBucket: "tap1-df28f.firebasestorage.app",
            messagingSenderId: "1092696732618",
            appId: "1:1092696732618:web:8a2284d1ec25479561d533"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 効果音システム
        let audioCtx = null;
        let isSoundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!isSoundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'tap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'combo') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'golden') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.setValueAtTime(1200, now + 0.05);
                osc.frequency.setValueAtTime(1600, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'finish') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        let currentUser = null;
        let score = 0;
        let combo = 0;
        let selectedTimeMode = 10;
        let timeLeft = 10.0;
        let timerId = null;
        let isPlaying = false;
        let myBestScoreValue = 0;
        let isGoldenCrop = false;
        let goldenTimeout = null;

        let myScoreUnsubscribe = null;
        let leaderboardUnsubscribe = null;

        const CROP_ICONS = ['fa-carrot', 'fa-apple-whole', 'fa-lemon', 'fa-pepper-hot', 'fa-seedling'];

        // DOM elements
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const authNotice = document.getElementById('authNotice');

        const clickBtn = document.getElementById('clickBtn');
        const cropIcon = document.getElementById('cropIcon');
        const clickBtnText = document.getElementById('clickBtnText');
        const startBtn = document.getElementById('startBtn');
        const scoreText = document.getElementById('scoreText');
        const timerText = document.getElementById('timerText');
        const comboText = document.getElementById('comboText');
        const effectContainer = document.getElementById('effectContainer');

        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const modeBtns = document.querySelectorAll('.mode-btn');

        const myHighScore = document.getElementById('myHighScore');
        const myScoreDate = document.getElementById('myScoreDate');
        const selectedModeLabel = document.getElementById('selectedModeLabel');
        const rankingModeBadge = document.getElementById('rankingModeBadge');
        const deleteScoreBtn = document.getElementById('deleteScoreBtn');
        const leaderboardList = document.getElementById('leaderboardList');

        const privacyPolicyBtn = document.getElementById('privacyPolicyBtn');
        const creditsBtn = document.getElementById('creditsBtn');

        soundToggleBtn.addEventListener('click', () => {
            isSoundEnabled = !isSoundEnabled;
            soundIcon.className = isSoundEnabled 
                ? 'fa-solid fa-volume-high text-emerald-400' 
                : 'fa-solid fa-volume-xmark text-slate-500';
        });

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isPlaying) return;
                modeBtns.forEach(b => {
                    b.className = 'mode-btn bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-xl font-bold border border-slate-600 hover:bg-slate-600 transition';
                });
                btn.className = 'mode-btn bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold border border-emerald-400 shadow-md transition';
                selectedTimeMode = parseInt(btn.dataset.time, 10);
                timeLeft = selectedTimeMode;
                timerText.textContent = `${selectedTimeMode}.0s`;
                selectedModeLabel.textContent = `Personal Best (${selectedTimeMode}秒)`;
                rankingModeBadge.textContent = `${selectedTimeMode}秒部門`;

                if (currentUser) {
                    listenToMyScore(currentUser.uid);
                }
                listenToLeaderboard();
            });
        });

        function showModal(title, messageHtml, iconClass = "fa-solid fa-info-circle", onConfirm = null) {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            const modalActions = document.getElementById('modalActions');

            modalTitle.textContent = title;
            modalMessage.innerHTML = messageHtml;
            modalIcon.innerHTML = `<i class="${iconClass}"></i>`;

            if (onConfirm) {
                modalActions.innerHTML = `
                    <button id="modalCancel" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold text-sm rounded-xl transition">キャンセル</button>
                    <button id="modalConfirm" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-sm rounded-xl transition">実行する</button>
                `;
                document.getElementById('modalCancel').onclick = closeModal;
                document.getElementById('modalConfirm').onclick = () => {
                    closeModal();
                    onConfirm();
                };
            } else {
                modalActions.innerHTML = `
                    <button id="modalCloseBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm py-2 rounded-xl transition">OK</button>
                `;
                document.getElementById('modalCloseBtn').onclick = closeModal;
            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
        }

        privacyPolicyBtn.addEventListener('click', () => {
            showModal(
                "個人情報保護方針・利用規約",
                `<div class="space-y-3 text-xs">
                    <p class="font-bold text-slate-200">1. 個人情報の取り扱いについて</p>
                    <p>当アプリはGoogleログイン認証を使用しますが、個人情報は一切収集・保持しません。保存されるのはゲームのハイスコアおよび表示用のニックネーム・アイコン画像URLのみです。</p>
                    <p class="font-bold text-slate-200">2. データの管理とセキュリティ</p>
                    <p>データはクラウドデータベース（Firestore）へ安全に送信・保存されます。</p>
                </div>`,
                "fa-solid fa-shield-halved text-emerald-400"
            );
        });

        creditsBtn.addEventListener('click', () => {
            showModal(
                "使用素材・ライセンス",
                `<div class="space-y-2 text-xs">
                    <ul class="list-disc pl-4 space-y-1">
                        <li>FontAwesome Free (アイコン)</li>
                        <li>Tailwind CSS (UIデザイン)</li>
                        <li>canvas-confetti (演出)</li>
                        <li>Web Audio API (効果音合成)</li>
                    </ul>
                </div>`,
                "fa-solid fa-copyright text-emerald-400"
            );
        });

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                }
            } catch (err) {
                console.warn("Custom token auth skipped or failed:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                userName.textContent = user.displayName || user.email || '農家さん';
                userAvatar.src = user.photoURL || `https://placehold.co/100x100/10b981/ffffff?text=${(user.displayName||'U').charAt(0)}`;
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                userInfo.classList.add('flex');
                authNotice.classList.add('hidden');

                listenToMyScore(user.uid);
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
                userInfo.classList.remove('flex');
                authNotice.classList.remove('hidden');
                
                myHighScore.textContent = '--';
                myScoreDate.textContent = '----/--/--';
                deleteScoreBtn.classList.add('hidden');
                myBestScoreValue = 0;
            }
        });

        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed:", error);
                if (error.code === 'auth/unauthorized-domain') {
                    const currentDomain = window.location.hostname;
                    showModal(
                        "ドメイン承認が必要です", 
                        `<div class="space-y-3 text-xs text-slate-300">
                            <p class="font-bold text-amber-300 text-sm">現在のドメイン: <code class="bg-slate-900 px-2 py-1 rounded text-white border border-amber-500/40 select-all">${currentDomain}</code></p>
                            <p>Firebase Authenticationの承認済みドメインに上記ドメインを追加してください。</p>
                        </div>`, 
                        "fa-solid fa-shield-cat text-amber-400"
                    );
                } else {
                    showModal("ログインエラー", `Googleログインに失敗しました。<br><span class="text-xs text-slate-400 font-mono">${error.message || error.code}</span>`, "fa-solid fa-triangle-exclamation text-rose-400");
                }
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => {
                showModal("ログアウト", "ログアウトしました。");
            });
        });

        function getScoreCollectionRef() {
            return collection(db, `click_game_scores_${selectedTimeMode}s`);
        }

        function getScoreDocRef(uid) {
            return doc(db, `click_game_scores_${selectedTimeMode}s`, uid);
        }

        function listenToMyScore(uid) {
            if (myScoreUnsubscribe) myScoreUnsubscribe();

            const scoreDoc = getScoreDocRef(uid);
            myScoreUnsubscribe = onSnapshot(scoreDoc, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    myBestScoreValue = data.score || 0;
                    myHighScore.textContent = myBestScoreValue;
                    deleteScoreBtn.classList.remove('hidden');

                    if (data.updatedAt) {
                        const date = data.updatedAt.toDate();
                        myScoreDate.textContent = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                    }
                } else {
                    myBestScoreValue = 0;
                    myHighScore.textContent = '0';
                    myScoreDate.textContent = '記録なし';
                    deleteScoreBtn.classList.add('hidden');
                }
            }, (error) => {
                console.error("Error loading user score:", error);
                if (error.code === 'permission-denied') {
                    showPermissionErrorNotice();
                }
            });
        }

        function listenToLeaderboard() {
            if (leaderboardUnsubscribe) leaderboardUnsubscribe();

            const scoreCol = getScoreCollectionRef();
            leaderboardUnsubscribe = onSnapshot(scoreCol, (snapshot) => {
                const list = [];
                snapshot.forEach(doc => {
                    list.push({ id: doc.id, ...doc.data() });
                });

                list.sort((a, b) => (b.score || 0) - (a.score || 0));
                renderLeaderboard(list.slice(0, 10));
            }, (error) => {
                console.error("Error loading leaderboard:", error);
                if (error.code === 'permission-denied') {
                    showPermissionErrorNotice();
                } else {
                    leaderboardList.innerHTML = `<p class="text-xs text-rose-400 text-center py-4">ランキングの読み込みに失敗しました</p>`;
                }
            });
        }

        function showPermissionErrorNotice() {
            leaderboardList.innerHTML = `
                <div class="p-3 bg-rose-950/40 border border-rose-500/30 rounded-xl text-center space-y-2">
                    <p class="text-xs font-bold text-rose-300"><i class="fa-solid fa-lock mr-1"></i>Firestore 権限エラー</p>
                    <p class="text-[11px] text-slate-300 leading-normal">
                        Firebase Console でセキュリティルールを更新してください。
                    </p>
                </div>
            `;
        }

        function renderLeaderboard(topScores) {
            if (topScores.length === 0) {
                leaderboardList.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">まだ記録がありません。<br>1番乗りで出荷スコアを記録しよう！</p>`;
                return;
            }

            leaderboardList.innerHTML = '';
            topScores.forEach((item, index) => {
                const isMe = currentUser && currentUser.uid === item.id;
                
                let rankBadge = `<span class="w-5 text-center text-xs font-bold text-slate-400">${index + 1}</span>`;
                if (index === 0) rankBadge = `<span class="w-5 text-center text-amber-400 text-sm"><i class="fa-solid fa-crown"></i></span>`;
                else if (index === 1) rankBadge = `<span class="w-5 text-center text-slate-300 text-sm"><i class="fa-solid fa-medal"></i></span>`;
                else if (index === 2) rankBadge = `<span class="w-5 text-center text-amber-600 text-sm"><i class="fa-solid fa-medal"></i></span>`;

                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2.5 rounded-xl border transition ${
                    isMe 
                        ? 'bg-emerald-950/60 border-emerald-500/50 text-white' 
                        : 'bg-slate-900/40 border-slate-800 text-slate-300'
                }`;

                row.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        ${rankBadge}
                        <img src="${item.photoURL || 'https://placehold.co/60x60/10b981/ffffff?text=U'}" class="w-6 h-6 rounded-full object-cover border border-slate-700">
                        <span class="text-xs font-semibold truncate max-w-[100px]">${item.userName || '匿名農家'}</span>
                    </div>
                    <div class="flex items-baseline space-x-1 font-mono">
                        <span class="text-sm font-extrabold text-emerald-400">${item.score}</span>
                        <span class="text-[10px] text-slate-500">pt</span>
                    </div>
                `;
                leaderboardList.appendChild(row);
            });
        }

        async function saveScore(finalScore) {
            if (!currentUser) return;

            if (finalScore > myBestScoreValue) {
                try {
                    const userDocRef = getScoreDocRef(currentUser.uid);
                    await setDoc(userDocRef, {
                        userName: currentUser.displayName || '匿名農家',
                        photoURL: currentUser.photoURL || '',
                        score: finalScore,
                        updatedAt: serverTimestamp()
                    });

                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });

                    showModal("🎉 大収穫！ハイスコア更新！", `おめでとうございます！新記録 [ ${finalScore} pt ] を出荷・記録しました！`, "fa-solid fa-wheat-awn text-amber-400");
                } catch (err) {
                    console.error("Score save error:", err);
                    showModal("保存失敗", "スコアの保存中にエラーが発生しました。<br>Firestoreのルールを確認してください。", "fa-solid fa-triangle-exclamation text-rose-400");
                }
            } else {
                showModal("収穫終了！", `今回の収穫スコア: ${finalScore} pt\n(自己ベスト: ${myBestScoreValue} pt)`, "fa-solid fa-flag-checkered");
            }
        }

        deleteScoreBtn.addEventListener('click', () => {
            if (!currentUser) return;
            showModal(
                "記録の削除", 
                `保存されている ${selectedTimeMode}秒部門のハイスコアを削除しますか？この操作は取り消せません。`, 
                "fa-solid fa-trash-can text-rose-500",
                async () => {
                    try {
                        const userDocRef = getScoreDocRef(currentUser.uid);
                        await deleteDoc(userDocRef);
                        showModal("削除完了", "ハイスコアを削除しました。");
                    } catch (err) {
                        console.error("Delete error:", err);
                        showModal("エラー", "削除処理に失敗しました。");
                    }
                }
            );
        });

        function triggerGoldenCrop() {
            if (!isPlaying || isGoldenCrop) return;

            isGoldenCrop = true;
            clickBtn.classList.add('golden-target');
            cropIcon.className = 'fa-solid fa-star text-5xl mb-2 text-amber-300 animate-spin';
            clickBtnText.textContent = '黄金作物!!';

            goldenTimeout = setTimeout(() => {
                resetGoldenCrop();
            }, 1800);
        }

        function resetGoldenCrop() {
            isGoldenCrop = false;
            clickBtn.classList.remove('golden-target');
            const randomIcon = CROP_ICONS[Math.floor(Math.random() * CROP_ICONS.length)];
            cropIcon.className = `fa-solid ${randomIcon} text-5xl mb-2 text-amber-300`;
            clickBtnText.textContent = 'HARVEST!';
        }

        function startGame() {
            if (isPlaying) return;

            isPlaying = true;
            score = 0;
            combo = 0;
            timeLeft = selectedTimeMode;

            scoreText.textContent = '0';
            comboText.textContent = '0';
            timerText.textContent = `${selectedTimeMode}.0s`;

            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            clickBtn.disabled = false;
            clickBtnText.textContent = 'HARVEST!';

            const startTime = Date.now();
            const duration = selectedTimeMode * 1000;

            scheduleNextGolden();

            timerId = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, duration - elapsed);
                timeLeft = (remaining / 1000).toFixed(1);
                timerText.textContent = `${timeLeft}s`;

                if (remaining <= 0) {
                    endGame();
                }
            }, 50);
        }

        function scheduleNextGolden() {
            if (!isPlaying) return;
            const randomDelay = Math.random() * 3000 + 2000;
            setTimeout(() => {
                if (isPlaying) {
                    triggerGoldenCrop();
                    scheduleNextGolden();
                }
            }, randomDelay);
        }

        function endGame() {
            clearInterval(timerId);
            clearTimeout(goldenTimeout);
            resetGoldenCrop();
            isPlaying = false;

            playSound('finish');

            clickBtn.disabled = true;
            clickBtnText.textContent = 'START待機';
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            saveScore(score);
        }

        function handleTap(e) {
            if (!isPlaying) return;

            combo++;
            let addedPoints = 1;
            let soundType = 'tap';

            if (isGoldenCrop) {
                addedPoints = 10;
                soundType = 'golden';
                resetGoldenCrop();
                clearTimeout(goldenTimeout);
            } else if (combo % 5 === 0) {
                addedPoints = 3;
                soundType = 'combo';
            }

            score += addedPoints;
            scoreText.textContent = score;
            comboText.textContent = combo;

            playSound(soundType);
            createFloatingEffect(e, addedPoints, isGoldenCrop);
        }

        function createFloatingEffect(e, pts, isGolden) {
            const rect = clickBtn.getBoundingClientRect();
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (!clientX) {
                clientX = rect.left + rect.width / 2;
                clientY = rect.top + rect.height / 2;
            }

            const floatEl = document.createElement('div');
            floatEl.className = `floating-text absolute font-black text-2xl drop-shadow-md select-none ${
                isGolden ? 'text-amber-300 text-4xl' : (pts > 1 ? 'text-emerald-300 text-3xl' : 'text-white')
            }`;
            floatEl.textContent = `+${pts}`;
            
            const containerRect = effectContainer.getBoundingClientRect();
            const x = clientX - containerRect.left;
            const y = clientY - containerRect.top;

            floatEl.style.left = `${x - 10}px`;
            floatEl.style.top = `${y - 20}px`;

            effectContainer.appendChild(floatEl);

            setTimeout(() => {
                floatEl.remove();
            }, 750);
        }

        startBtn.addEventListener('click', startGame);
        clickBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap(e);
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            listenToLeaderboard();
        });
    </script>
</body>
</html>
